<div class="container-fluid mt-4">
  <p class="h3">Transaction</p>
  <div class="row">
    <div class="col-4">
      <div appWrapper>
        <p class="h4">Categories</p>
        <app-category-list />
      </div>
    </div>
    <div class="col-8">
      <div appWrapper>
        <div class="d-flex justify-content-between align-items-center">
          <p class="h4 m-0">Transactions</p>
          <button
            mat-button
            class="btn-sm"
            (click)="openNewTransactionDialog()"

            <i class="bi bi-plus-circle-dotted p-1"></i> Add transaction
          </button>
        </div>
        <hr />
        <app-transaction-list />
      </div>
    </div>
  </div>
</div>
